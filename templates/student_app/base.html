<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar {
            padding: 12px 0;
        }

        .navbar-brand {
            font-size: 1.4rem;
        }

        .nav-link {
            font-weight: 500;
        }

        .btn {
            border-radius: 10px;
            padding: 8px 18px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold text-primary" href="{% url 'student_list' %}">
            🎓 Student Management
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Left Side -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{% url 'student_list' %}">
                        🏠 Home
                    </a>
                </li>
            </ul>

            <!-- Right Side -->
            <div class="d-flex gap-2">

                <a href="{% url 'create_student' %}" class="btn btn-primary">
                    + Add Student
                </a>

                <a href="{% url 'register' %}" class="btn btn-success">
                    Register
                </a>

                <a href="{% url 'login' %}" class="btn btn-outline-primary">
                    Login
                </a>
                
                {% if request.user.is_authenticated %}

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">
                        Logout
                    </button>
                </form>

                {% endif %}

            </div>

        </div>
    </div>
</nav>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div>
    {% block content %}
    
    {% endblock %}
</div>
</body>
</html>
