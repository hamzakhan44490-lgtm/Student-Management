{% extends "student_app/base.html" %}

{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static "student_app/student_form.css" %}">

<div class="student-wrapper">

    <div class="student-card">

        <h2>
            {% if form.instance.pk %}
                Edit Student
            {% else %}
                Student Registration
            {% endif %}
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="button-group">

                <button type="submit" class="submit-btn">
                    {% if form.instance.pk %}
                        Update Student
                    {% else %}
                        Register Student
                    {% endif %}
                </button>

                <a href="{% url 'student_list' %}" class="back-btn">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
