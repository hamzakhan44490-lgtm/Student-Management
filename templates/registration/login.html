<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#7a1cff,#3d2bff);
    padding:0;

}

.login-box{

    width:1000px;
    height:560px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    display:flex;
    box-shadow:0 30px 60px rgba(0,0,0,.18);

}

.left{

    width:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;

}

.right{

    width:50%;
    background:linear-gradient(135deg,#7a1cff,#3d2bff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;

}

/* White Wave */

.right::before{

content:"";
position:absolute;
left:-120px;
top:-40px;
width:650px;
height:650px;
background:white;
border-radius:50%;

}

.right-content{

position:relative;
z-index:2;
text-align:center;
padding:40px;
max-width:320px;
color:#222;

}

.right-content h1{

font-size:42px;
font-weight:700;
margin-bottom:20px;

}

.right-content p{

color:#666;
line-height:1.8;

}

.form-area{

width:100%;

}

.form-area h1{

font-size:45px;
font-weight:700;
text-align:center;

}

.form-area p{

text-align:center;
margin-bottom:40px;
color:#888;

}

.input-box{

position:relative;
margin-bottom:25px;

}

.input-box i{

position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
color:#7d2cff;
font-size:22px;

}

.input-box input{

width:100%;
height:58px;
padding-left:60px;
border:none;
outline:none;
border-radius:50px;
background:#f7f7ff;
box-shadow:0 8px 20px rgba(122,28,255,.12);

}

.options{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
font-size:14px;

}

.options a{

text-decoration:none;
color:#7d2cff;

}

.login-btn{

width:100%;
height:55px;
border:none;
border-radius:50px;
background:linear-gradient(to right,#7a1cff,#2d1eff);
color:white;
font-weight:600;
font-size:18px;
transition:.3s;

}

.login-btn:hover{

transform:translateY(-3px);

}

.bottom{

margin-top:35px;
text-align:center;

}

.bottom a{

text-decoration:none;
color:#7d2cff;
font-weight:600;

}

</style>

</head>

<body>

<div class="login-box">

<div class="left">

<div class="form-area">

<h1>Welcome!</h1>

<p>Sign In to your account</p>

<form method="POST">

{% csrf_token %}

<div class="input-box">

<i class="bi bi-person-fill"></i>

{{ form.username }}

</div>

<div class="input-box">

<i class="bi bi-lock-fill"></i>

{{ form.password }}

</div>

<div class="options">

<div>

<input type="checkbox">

Remember me

</div>

<a href="#">Forgot Password?</a>

</div>

<button class="login-btn">

SIGN IN

</button>

</form>

<div class="bottom">

Don't have an account?

<a href="{% url 'register' %}">Create</a>

</div>

</div>

</div>

<div class="right">

<div class="right-content">

<h1>Welcome Back!</h1>

<p>

Lorem ipsum dolor sit amet, consectetur adipisicing elit.
Sed pharetra magna nisl, at posuere sem dapibus sed.

</p>

</div>

</div>

</div>

</body>
</html>
